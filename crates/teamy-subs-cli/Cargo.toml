[package]
name = "teamy-subs-cli"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
license = "MPL-2.0"
repository = "https://github.com/TeamDman/teamy-subs"
description = "CLI implementation crate for teamy-subs"

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
chrono = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing-tracy = { version = "0.11", optional = true }
directories-next = "2"
tokio = { version = "1.49.0", features = ["full"] }
facet = "0.44.1"
figue = { git = "https://github.com/TeamDman/figue", rev = "0e82172c21e9ce0ecc4521ff01f6dbf56342867f", features = ["arbitrary"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teamy-facet-vtt = { path = "../teamy-facet-vtt" }
vtt = "1.0.0"

[target.'cfg(windows)'.dependencies]
teamy-windows = "0.9.0"

[features]
default = []
tracy = ["dep:tracing-tracy"]