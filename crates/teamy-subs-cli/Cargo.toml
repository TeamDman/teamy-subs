[package]
name = "teamy-subs-cli"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
license = "MPL-2.0"
repository = "https://github.com/TeamDman/teamy-subs"
description = "CLI implementation crate for teamy-subs"
readme = "../../README.md"
keywords = ["subtitles", "subdl", "yt-dlp", "cli"]
categories = ["command-line-utilities"]

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
chrono = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "registry"] }
tracing-tracy = { version = "0.11", optional = true }
directories-next = "2"
tokio = { version = "1.49.0", features = ["full"] }
teamy-cancellation = { git = "https://github.com/TeamDman/teamy-cancellation.git", rev = "7c77848", features = ["figue", "arbitrary"] }
facet = { git = "https://github.com/TeamDman/facet.git", rev = "23ad4dcd0", package = "facet" }
facet-csv = { git = "https://github.com/TeamDman/facet.git", rev = "23ad4dcd0", package = "facet-csv" }
facet-json = { git = "https://github.com/TeamDman/facet.git", rev = "23ad4dcd0", package = "facet-json" }
facet-pretty = { git = "https://github.com/TeamDman/facet.git", rev = "23ad4dcd0", package = "facet-pretty" }
figue = { git = "https://github.com/TeamDman/facet.git", rev = "23ad4dcd0", package = "figue", features = ["arbitrary"] }
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
teamy-facet-vtt = { path = "../teamy-facet-vtt" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Console", "Win32_System_Ole", "Win32_System_TaskScheduler", "Win32_System_Threading", "Win32_System_Variant"] }

[features]
default = []
extended_observability = []
tracy = ["extended_observability", "dep:tracing-tracy"]
